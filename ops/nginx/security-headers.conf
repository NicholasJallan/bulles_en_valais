# Security headers of the `dive` server block (plans/refonte-la-descente/02-architecture.md §14).
# Written in S11, applied by nginx in S13:
#   include /etc/nginx/snippets/bulles-security-headers.conf;
# in the server block AND in every location that has its own add_header (nginx drops the inherited
# ones there). scripts/serve-with-csp.mjs serves dist/ with these same headers for the tests.
#
# CSP: Google domains checked against https://developers.google.com/tag-platform/security/guides/csp
# (page updated 2026-09-18, read 2026-10-02) for the Google tag with Google Analytics 4 and Google
# Ads conversions. Google lists `google.<TLD>` per country: .ch for Swiss visitors, .fr for French
# ones (Léman). googleads.g.doubleclick.net/pagead/viewthroughconversion/ in script-src (path only: the
# host serves JSONP): seen in production (S13), the Ads tag loads
# its view-through script from there after consent. No 'unsafe-inline' nor 'unsafe-eval' for scripts: every script is a file of the
# site; 'unsafe-inline' for styles is the accepted compromise of §14 (style attributes, banner).
# One line per header: nginx would send a line break inside the value.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://googleads.g.doubleclick.net/pagead/viewthroughconversion/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://www.googleadservices.com https://*.g.doubleclick.net https://pagead2.googlesyndication.com https://*.google.com https://*.google.ch https://*.google.fr; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://www.googleadservices.com https://*.g.doubleclick.net https://ad.doubleclick.net https://pagead2.googlesyndication.com https://*.google.com https://*.google.ch https://*.google.fr; font-src 'self'; frame-src https://www.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
