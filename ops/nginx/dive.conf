# Reference copy of the nginx configuration that serves dive.bullesenvalais.ch today
# (old React site), read on the Pi on 2026-10-02 (S12) from
# /etc/nginx/sites-available/bullesenvalais: only the blocks of the dive site and of the
# names that redirect to it. The other blocks of that file (shop, fede, silence, dp-fede)
# are not ours. No secret here: only paths to the Let's Encrypt files.
#
# Not applied from the repository. S13 changes the dive block (root on the releases,
# $realpath_root, real 404, caching, final headers from security-headers.conf):
# see plans/refonte-la-descente/02-architecture.md §16.
#
# Server facts (2026-10-02): nginx 1.22.1; PHP-FPM 7.4 (pool www, www-data,
# /run/php/php7.4-fpm.sock, no open_basedir, PrivateTmp=no, ProtectSystem=full);
# http block: gzip on (text/html only), ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
# certbot renews www.bullesenvalais.ch (all the names below) by webroot
# /var/www/html/dive: keep that folder (or move webroot_path) when the old site goes.

# Contact form (dive): 5 requests/min per IP, burst of 3 (http context).
limit_req_zone $binary_remote_addr zone=contact:1m rate=5r/m;

server {
    listen 80;
    server_name dive.bullesenvalais.ch dive.bulleenvalais.ch dive.bullesenvalais.com dive.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}
server {
    listen 80;
    server_name bullesenvalais.ch bullesenvalais.com bulleenvalais.ch bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bullesenvalais.ch bullesenvalais.com bulleenvalais.ch bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    ssl_certificate /etc/letsencrypt/live/www.bullesenvalais.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bullesenvalais.ch/privkey.pem;
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}

server {
 # SSL configuration
 #
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 
 #ssl on;

 root /var/www/html/dive;
 index index.html;
 server_name dive dive.bullesenvalais.ch dive.bullesenvalais.com dive.bulleenvalais.ch dive.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }

 ssl_certificate /etc/letsencrypt/live/www.bullesenvalais.ch/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/www.bullesenvalais.ch/privkey.pem;
 
 client_max_body_size 16M;

 proxy_read_timeout 3600;

 access_log /var/log/nginx/dive.access_log;
 error_log /var/log/nginx/dive.error_log
 notice;

 # Security headers (dive only)
 add_header Cache-Control "no-cache, must-revalidate" always;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://www.googletagmanager.com; script-src-elem 'self' 'unsafe-inline' https://unpkg.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net; connect-src 'self' https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /api/csp/report;" always;

 # Block dot-directories (.git, .idea, .venv, etc.)
 location ~ /\. {
  deny all;
 }

 location / {
  try_files $uri $uri/ /index.html;
 }

 location = /api/contact {
  try_files $uri /api/contact.php;
 }
 # Only the contact endpoint runs PHP: rate-limited, small bodies.
 location = /api/contact.php {
  limit_req zone=contact burst=3 nodelay;
  limit_req_status 429;
  client_max_body_size 32k;
  include snippets/fastcgi-php.conf;
  fastcgi_pass unix:/run/php/php7.4-fpm.sock;
  fastcgi_read_timeout 300;
 }
 # Any other .php file (mail-config.php, stray copies) is neither run nor served.
 location ~ \.php$ {
  return 404;
 }
 # Nothing else under /api/ is served either (e.g. a stray mail-config.php backup).
 location ^~ /api/ {
  return 404;
 }
}

server {
    listen 80;
    server_name www.bullesenvalais.ch www.bullesenvalais.com www.bulleenvalais.ch www.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bullesenvalais.ch www.bullesenvalais.com www.bulleenvalais.ch www.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    ssl_certificate /etc/letsencrypt/live/www.bullesenvalais.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bullesenvalais.ch/privkey.pem;
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}
