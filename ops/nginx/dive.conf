# Reference copy of the nginx configuration that serves dive.bullesenvalais.ch, as applied on
# the Pi on 2026-10-02 (S13) in /etc/nginx/sites-available/bullesenvalais: only the blocks of the
# dive site and of the names that redirect to it. The other blocks of that file (shop, fede,
# silence, dp-fede) are not ours. No secret here: only paths to the Let's Encrypt files.
#
# Not applied from the repository: edit the file on the Pi (backup first, then
# `sudo nginx -t && sudo systemctl reload nginx`) and copy the change here.
# The headers snippet is ops/nginx/security-headers.conf, installed as
# /etc/nginx/snippets/bulles-security-headers.conf.
#
# Server facts (2026-10-02): nginx 1.22.1 (OpenSSL 3.0); PHP-FPM 7.4 (pool www, www-data,
# /run/php/php7.4-fpm.sock, no open_basedir, PrivateTmp=no, ProtectSystem=full), the default of
# the other sites too; php8.2 passes the unit tests of contact.php but its FPM pool is stopped;
# http block: gzip on (text/html only, the dive block adds the text types),
# ssl_protocols TLSv1.2 TLSv1.3 (since S13); /etc/logrotate.d/nginx-dive rotates the dive logs
# (weekly, 8 kept); certbot renews www.bullesenvalais.ch (all the names below) by webroot
# /var/www/html/dive: keep that folder (or move webroot_path) when the old site goes.
# Backups on the Pi: sites-available/bullesenvalais.bak-20261002-155459-s13 (before the switch).

# Contact form (dive): 5 requests/min per IP, burst of 3 (http context).
limit_req_zone $binary_remote_addr zone=contact:1m rate=5r/m;

server {
    listen 80;
    server_name dive.bullesenvalais.ch dive.bulleenvalais.ch dive.bullesenvalais.com dive.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}
server {
    listen 80;
    server_name bullesenvalais.ch bullesenvalais.com bulleenvalais.ch bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bullesenvalais.ch bullesenvalais.com bulleenvalais.ch bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    ssl_certificate /etc/letsencrypt/live/www.bullesenvalais.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bullesenvalais.ch/privkey.pem;
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}

server {
 # La Descente (S13): static build of the Astro site, served from the current release.
 listen 443 ssl http2;
 listen [::]:443 ssl http2;

 # Atomic releases (ops/deploy.sh): current -> releases/<UTC timestamp>/
 root /var/www/bullesenvalais/current;
 index index.html;
 server_name dive dive.bullesenvalais.ch dive.bullesenvalais.com dive.bulleenvalais.ch dive.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex).
    # certbot renews every name by this webroot: keep it when the old docroot goes.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }

 ssl_certificate /etc/letsencrypt/live/www.bullesenvalais.ch/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/www.bullesenvalais.ch/privkey.pem;

 client_max_body_size 1m;

 access_log /var/log/nginx/dive.access_log;
 error_log /var/log/nginx/dive.error_log
 notice;

 # Text types (the http block only compresses HTML); budgets are measured at level 6.
 gzip on;
 gzip_comp_level 6;
 gzip_vary on;
 gzip_min_length 256;
 gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

 # Security headers (ops/nginx/security-headers.conf). nginx drops inherited add_header in a
 # location that has its own: every such location includes the snippet again.
 include snippets/bulles-security-headers.conf;
 # HTML and unhashed files (boot.js, consent-default.js, robots.txt…): always revalidated.
 add_header Cache-Control "no-cache" always;

 # A real 404 (no SPA fallback any more).
 error_page 404 /404.html;

 # Block dot-directories (.git, .idea, .venv, etc.)
 location ~ /\. {
  deny all;
 }

 location / {
  try_files $uri $uri/ =404;
 }

 # Hashed by the build: cached for a year.
 location ^~ /_astro/ {
  include snippets/bulles-security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
 }

 # Icons and share images (not hashed): 30 days.
 location ~* \.(?:avif|webp|jpe?g|png|svg|ico|woff2)$ {
  include snippets/bulles-security-headers.conf;
  add_header Cache-Control "public, max-age=2592000" always;
  try_files $uri =404;
 }

 # mime.types of nginx 1.22 does not know .webmanifest.
 location = /site.webmanifest {
  default_type application/manifest+json;
  try_files $uri =404;
 }

 location = /api/contact {
  try_files $uri /api/contact.php;
 }
 # Only the contact endpoint runs PHP: rate-limited, small bodies. $realpath_root: the PHP
 # path is resolved through the current symlink, so a switch never runs a stale release.
 location = /api/contact.php {
  limit_req zone=contact burst=3 nodelay;
  limit_req_status 429;
  client_max_body_size 32k;
  try_files $uri =404;
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
  fastcgi_param DOCUMENT_ROOT $realpath_root;
  fastcgi_pass unix:/run/php/php7.4-fpm.sock;
  fastcgi_read_timeout 60;
 }
 # Any other .php file (mail-config.php, stray copies) is neither run nor served.
 location ~ \.php$ {
  return 404;
 }
 # Nothing else under /api/ is served either.
 location ^~ /api/ {
  return 404;
 }
}

server {
    listen 80;
    server_name www.bullesenvalais.ch www.bullesenvalais.com www.bulleenvalais.ch www.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bullesenvalais.ch www.bullesenvalais.com www.bulleenvalais.ch www.bulleenvalais.com;
    # ACME http-01 — doit précéder le deny des dot-dirs (^~ bat les regex)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dive;
    }
    ssl_certificate /etc/letsencrypt/live/www.bullesenvalais.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bullesenvalais.ch/privkey.pem;
    location / {
        return 301 https://dive.bullesenvalais.ch$request_uri;
    }
}
