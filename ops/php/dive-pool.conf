; Reference copy of the PHP-FPM 8.5 pool that runs public/api/contact.php for the dive site,
; installed on the Pi as /etc/php/8.5/fpm/pool.d/dive.conf (D57). Not applied from the
; repository: edit the file on the Pi, `sudo php-fpm8.5 -t && sudo systemctl reload php8.5-fpm`,
; then copy the change here.
;
; The pool runs as its own system user, so the code of the other sites of the Pi (PHP-FPM 7.4,
; pool www, www-data) cannot read the SMTP credentials: shared/ is 750 root:bulles-php,
; mail-config.php 640 root:bulles-php, state/ 700 bulles-php. The pool www of PHP 8.5 is set
; aside (www.conf.disabled): without it, the socket helper of php8.5-fpm.service registers no
; php-fpm.sock alternative, and nothing else listens.

[dive]
user = bulles-php
group = bulles-php

; nginx (www-data) connects to the socket; the workers never touch it.
listen = /run/php/php8.5-fpm-dive.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A few e-mails a day: no worker while idle.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 60s
pm.max_requests = 200

; error_log() goes to FastCGI stderr, so the `contact:` lines land in nginx's dive.error_log.
catch_workers_output = no
clear_env = yes

; The releases (the code) and shared/ (credentials, counters), nothing else: DNS and the CA store
; are read by the C libraries, outside this check (tested on the Pi before the switch).
php_admin_value[open_basedir] = /var/www/bullesenvalais/releases/:/var/www/bullesenvalais/shared/
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
