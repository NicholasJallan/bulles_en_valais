name: Rapport Quotidien Google Ads

on:
  schedule:
    # 04:00 UTC correspond à 06:00 heure locale suisse (CEST, UTC+2) ou 05:00 (CET, UTC+1)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de lancer le rapport manuellement à tout moment depuis l'interface GitHub

# Le rapport ne fait que lire le dépôt : le jeton GitHub n'a pas d'autre droit.
permissions:
  contents: read

jobs:
  send-report:
    name: Extraire GA4 et Envoyer le Rapport
    # Image fixée : ubuntu-latest passe à Ubuntu 26 dès le 19.10.2026, à valider avant d'y aller.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurer Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/google-ads-report/requirements.txt'

      - name: Installer les dépendances
        run: |
          pip install -r scripts/google-ads-report/requirements.txt

      - name: Tester le script (rendu, échappement, plage de dates, SMTP)
        run: |
          python -m unittest discover -s scripts/google-ads-report -p 'test_*.py'

      - name: Exécuter le script de reporting et envoyer l'e-mail
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          GA4_PROPERTY_ID: '358387240'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: |
          python scripts/google-ads-report/send_report.py
